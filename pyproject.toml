[project]
name = "gpu-price-terminal"
version = "0.1.0"
description = "Trading-style charts over the published Computable GPU Index record"
requires-python = ">=3.11"
dependencies = [
    # Digest-verifying reader for the published record. Pinned to a commit so
    # a publisher-side layout change can't silently change what we read.
    "gpu-index @ git+https://github.com/getcomputable/gpu-index@528b639",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_terminal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not live'"
markers = ["live: reads the real published record over the network"]

[tool.ruff]
line-length = 100
src = ["src"]
